services:
  live-logs:
    build: .
    ports:
      - "8081:8081"
    environment:
      LOG_HISTORY_FILE: /app/data/logs.jsonl
      LOG_RETENTION_HOURS: 6
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      PORT: 8081
      SETTINGS_FILE: /app/data/settings.json
    volumes:
      - ./data:/app/data
    restart: unless-stopped
